<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">Lateral G Therapy logo: a racing line curving through a corner to form the letter G</title>
  <rect width="64" height="64" rx="14" fill="#16171a"/>
  <!-- outer racing line forming a G -->
  <path d="M47.5 17.5 A20 20 0 1 0 52 36 H34" fill="none" stroke="#ff7a1a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- inner curb stripe -->
  <path d="M42 22.5 A13 13 0 1 0 44.6 36" fill="none" stroke="#f4ede1" stroke-width="2.2" stroke-dasharray="3.2 3.2" stroke-linecap="butt"/>
  <!-- apex marker -->
  <circle cx="34" cy="36" r="3.4" fill="#f4ede1"/>
</svg>
